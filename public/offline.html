<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>You're Offline | Subteen</title>
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
        padding-top: calc(24px + env(safe-area-inset-top));
      }
      .card { text-align: center; max-width: 420px; width: 100%; }
      .logo {
        font-size: 40px;
        font-weight: 900;
        letter-spacing: -0.05em;
        color: #ffffff;
        margin-bottom: 40px;
      }
      .logo span { color: #b8ff4d; }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #b8ff4d;
        border: 1px solid rgba(184, 255, 77, 0.35);
        background: rgba(184, 255, 77, 0.08);
        border-radius: 999px;
        padding: 8px 16px;
        margin-bottom: 24px;
      }
      h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.02em; margin-bottom: 14px; }
      p { color: #a1a1a1; line-height: 1.6; font-size: 15px; margin-bottom: 36px; }
      button {
        width: 100%;
        background: #b8ff4d;
        color: #000;
        border: none;
        border-radius: 999px;
        padding: 16px 24px;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
        touch-action: manipulation;
        transition: background 0.2s ease;
      }
      button:hover { background: #ffffff; }
      .hint { margin-top: 20px; font-size: 12px; color: #525252; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">SUB<span>TEEN</span></div>
      <div class="badge">You're Offline</div>
      <h1>No connection</h1>
      <p>
        You're currently offline. Reconnect to continue exploring the latest
        gaming news, reviews and guides.
      </p>
      <button type="button" onclick="location.reload()">Try Again</button>
      <div class="hint">Already visited pages may still be available offline.</div>
    </div>
  </body>
</html>
