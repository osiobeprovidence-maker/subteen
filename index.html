<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Subteen</title>
    <meta
      name="description"
      content="Subteen — the home of gaming news, reviews, guides and communities. Latest esports, hardware, patch notes, trailers and deals for local gamers."
    />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="application-name" content="Subteen" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Subteen" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#B8FF4D" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#0A0A0A;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;">
        <div style="font-weight:900;letter-spacing:-0.05em;font-size:34px;color:#F5F5F5;line-height:1;">SUB<span style="color:#B8FF4D">TEEN</span></div>
        <div style="width:148px;height:2px;background:rgba(255,255,255,.1);border-radius:9999px;overflow:hidden;">
          <div style="width:40%;height:100%;background:#B8FF4D;border-radius:9999px;animation:st-sweep 1.1s ease-in-out infinite;"></div>
        </div>
        <style>@keyframes st-sweep{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
